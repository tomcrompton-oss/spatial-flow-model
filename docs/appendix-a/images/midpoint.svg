<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img"><title>midpoint</title><defs></defs><rect width="760" height="330" rx="10" fill="#ffffff" stroke="#d0d0d0"/><ellipse cx="90.0" cy="250.0" rx="7.0" ry="7.0" fill="#1a1a1a" transform="rotate(0.0 90.0 250.0)"/><text x="86.0" y="280.0" fill="#1a1a1a" font-family="'STIX Two Text', 'Times New Roman', Times, serif" font-size="13.5" text-anchor="middle">start: x, p</text><line x1="90.0" y1="250.0" x2="287.2" y2="104.0" stroke="#b8b8b8" stroke-width="1.79" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M283.7 101.3 L294.0 99.0 L288.8 108.2 Z" fill="#b8b8b8"/><ellipse cx="300.0" cy="95.0" rx="6.0" ry="6.0" fill="#b8b8b8" transform="rotate(0.0 300.0 95.0)"/><text x="300.0" y="79.0" fill="#1a1a1a" font-family="'STIX Two Text', 'Times New Roman', Times, serif" font-size="12.8" text-anchor="middle">the middle</text><text x="150.0" y="140.0" fill="#1a1a1a" font-family="'STIX Two Text', 'Times New Roman', Times, serif" font-size="12.8" text-anchor="start">1. half a step, at the</text><text x="150.0" y="158.0" fill="#1a1a1a" font-family="'STIX Two Text', 'Times New Roman', Times, serif" font-size="12.8" text-anchor="start">start's rates</text><line x1="310.0" y1="95.0" x2="441.3" y2="83.3" stroke="#1b8a4f" stroke-width="2.02" stroke-linecap="round"/><path d="M439.6 78.9 L450.0 82.5 L440.4 87.8 Z" fill="#1b8a4f"/><text x="464.0" y="86.5" fill="#1b8a4f" font-family="'STIX Two Text', 'Times New Roman', Times, serif" font-size="12.8" text-anchor="start">the rates there: dx/dt, dp/dt</text><line x1="90.0" y1="250.0" x2="632.2" y2="202.9" stroke="#c4362a" stroke-width="2.69" stroke-linecap="round"/><path d="M630.4 198.0 L642.0 202.0 L631.3 208.0 Z" fill="#c4362a"/><ellipse cx="650.0" cy="200.0" rx="7.0" ry="7.0" fill="#1a1a1a" transform="rotate(0.0 650.0 200.0)"/><text x="656.0" y="230.0" fill="#1a1a1a" font-family="'STIX Two Text', 'Times New Roman', Times, serif" font-size="13.5" t