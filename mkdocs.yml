site_name: Spatial Flow Model
site_description: Gravity as a flow of space, a view of general relativity - simulations, studies against GR, and a browser viewer
site_url: https://tomcrompton-oss.github.io/spatial-flow-model/
repo_url: https://github.com/tomcrompton-oss/spatial-flow-model
repo_name: tomcrompton-oss/spatial-flow-model
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Synopsis: index.md
  - Preface: preface.md
  - Part 1 – Flow around a Single Body:
      - Hypothesis: part1/hypothesis.md
      - Mechanics of Spatial Flow:
          - part1/mechanics/index.md
          - Newtonian: part1/mechanics/newtonian.md
          - Special Relativistic: part1/mechanics/special-relativistic.md
          - The Four Clocks: part1/mechanics/four-clocks.md
      - The Four Tests:
          - part1/tests/index.md
          - The Gravitational Redshift of Light: part1/tests/redshift.md
          - The Bending of Light: part1/tests/bending.md
          - The Precession of Mercury: part1/tests/precession.md
          - The Shapiro Time Delay: part1/tests/shapiro.md
      - Black Holes: part1/black-holes.md
      - Rotating Black Holes: part1/rotating-black-holes.md
      - White Holes: part1/white-holes.md
      - Conclusion: part1/conclusion.md
  - Part 2 – Multiple Stationary Bodies:
      - The Two Body Problem: part2/two-body-problem.md
      - Hollow Sphere: part2/hollow-sphere.md
      - Potential Flow: part2/potential-flow.md
      - Seams: part2/seams.md
      - Curved Space: part2/curved-space.md
      - Deriving Curved Space: part2/deriving-curved-space.md
      - Multiple Bodies: part2/multiple-bodies.md
      - Conclusion: part2/conclusion.md
  - Part 3 – Dynamic Bodies (Fixed Paths):
      - Dynamic Models: part3/dynamic-models.md
      - Carrying the Flow: part3/carrying-the-flow.md
      - Curving the Turning Flow: part3/curving-the-turning-flow.md
      - One Potential: part3/one-potential.md
      - Conclusion: part3/conclusion.md
  - Part 4 – Dynamic Bodies:
      - Bodies Moved by the Flow: part4/bodies-moved-by-the-flow.md
      - Each Body in the Others' Flow: part4/each-body-in-the-others-flow.md
      - Moving With Its Own Space: part4/moving-with-its-own-space.md
      - Spinning Bodies: part4/spinning-bodies.md
      - Conclusion: part4/conclusion.md
  - Part 5 – Gravitational Waves: part5.md
  - Part 6 – Hawking and Unruh Radiation: part6/index.md
  - Conclusion:
      - conclusion/index.md
      - The Model, Step by Step: conclusion/step-by-step.md
      - What Comes From Outside: conclusion/from-outside.md
  - Appendix A – Simulations:
      - appendix-a/index.md
      - The Simulator: appendix-a/simulator.md
      - Models: appendix-a/models.md
      - Viewers: appendix-a/viewers.md
      - Results: appendix-a/results.md
      - File Formats: appendix-a/formats.md
  - Appendix B – Rabbit Holes:
      - appendix-b/index.md
      - How Much Gravity Can Go in the Clocks?: appendix-b/clocks.md
      - Each Body Separately: appendix-b/each-body-separately.md
      - Two Checks on Every Model: appendix-b/two-checks.md
      - Flows With Curl: appendix-b/flows-with-curl.md
      - One Time or Many: appendix-b/one-time-or-many.md
      - The Step and the Geodesic: appendix-b/step-and-geodesic.md
  - Appendix C – References:
      - appendix-c/index.md
      - References: appendix-c/references.md
      - Prior Work: appendix-c/prior-work.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
