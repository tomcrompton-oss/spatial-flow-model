site_name: Spatial Flow Model
site_description: Gravity as a flow of space - simulations, studies against GR, and a browser viewer
site_url: https://tomcrompton-oss.github.io/spatial-flow-model/
repo_url: https://github.com/tomcrompton-oss/spatial-flow-model
repo_name: tomcrompton-oss/spatial-flow-model
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Overview: index.md
  - Preface: preface.md
  - Part 1 – The Flow of Space:
      - 1.1 Hypothesis: part1/hypothesis.md
      - 1.2 Mechanics of spatial flow: part1/mechanics.md
      - 1.3 The four tests: part1/tests.md
      - 1.4 Conclusion: part1/conclusion.md
  - Part 2 – Placeholder:
      - Two bodies:
          - Introduction: two-bodies/index.md
          - Vector addition: two-bodies/vectors.md
          - Along g: two-bodies/along-g.md
          - The eikonal flow: two-bodies/eikonal.md
          - Each body carrying its flow: two-bodies/turning.md
          - Each body separately: two-bodies/split.md
          - Two checks on every model: two-bodies/checks.md
      - Gravitational waves: waves.md
      - Many bodies: many-bodies.md
      - Lapse and curved space: lapse-curved-space.md
  - Simulations:
      - Viewers: viewers.md
      - Results: results.md
      - File formats: formats.md
  - References: references.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
