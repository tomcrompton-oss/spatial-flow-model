site_name: Spatial Flow Model
site_description: Gravity as a flow of space, a view of general relativity - simulations, studies against GR, and a browser viewer
site_url: https://tomcrompton-oss.github.io/spatial-flow-model/
repo_url: https://github.com/tomcrompton-oss/spatial-flow-model
repo_name: tomcrompton-oss/spatial-flow-model
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Synopsis: index.md
  - Preface: preface.md
  - Part 1 – Flow around a Single Body: part1.md
  - Part 2 – Two Stationary Bodies: part2.md
  - Part 3 – Dynamic Bodies (Fixed Paths): part3.md
  - Part 4 – Dynamic Bodies: part4.md
  - Part 5 – Gravitational Waves: part5.md
  - Conclusion: conclusion.md
  - Appendix A – Simulations: appendix-a.md
  - Appendix B – Rabbit Holes: appendix-b.md
  - Appendix C – References: appendix-c.md
  - Archive:
      - Overview: archive/index.md
      - Preface: archive/preface.md
      - The model, step by step: archive/evolution.md
      - What comes from outside: archive/from-outside.md
      - Part 1 – The Flow of Space:
          - 1.1 Hypothesis: archive/part1/hypothesis.md
          - 1.2 Mechanics of spatial flow: archive/part1/mechanics.md
          - 1.3 The four tests: archive/part1/tests.md
          - 1.4 Conclusion: archive/part1/conclusion.md
      - Part 2 – More than one body:
          - Part 2 in brief: archive/part2.md
          - Two bodies:
              - Introduction: archive/two-bodies/index.md
              - Vector addition: archive/two-bodies/vectors.md
              - Along g: archive/two-bodies/along-g.md
              - The eikonal flow: archive/two-bodies/eikonal.md
              - Each body carrying its flow: archive/two-bodies/turning.md
              - Each body separately: archive/two-bodies/split.md
              - Two checks on every model: archive/two-bodies/checks.md
          - Gravitational waves: archive/waves.md
          - Many bodies: archive/many-bodies.md
          - Lapse and curved space: archive/lapse-curved-space.md
          - Scorecard: archive/scorecard.md
      - Simulations:
          - Viewers: archive/viewers.md
          - Results: archive/results.md
          - File formats: archive/formats.md
      - Prior work: archive/prior-work.md
      - References: archive/references.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
